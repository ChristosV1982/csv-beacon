<!-- public/tmsa-kpi-presentation.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>C.S.V. BEACON - TMSA KPI Audit Presentation</title>

  <link rel="stylesheet" href="./csv-beacon-theme.css?v=20260428_3" />
  <link rel="stylesheet" href="./style.css?v=20260428_3" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./auth.js"></script>
  <script src="./csvb-module-guard.js?v=20260610_tmsa_kpi_presentation_1"></script>

  <style>
    body{margin:0;padding:10px;background:#eef4fb;font-family:"Segoe UI",Arial,sans-serif;color:#06305c}
    .wrap{width:calc(100vw - 20px);max-width:none;margin:0 auto}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#062b55;color:#fff;border-radius:14px;padding:9px 12px;margin-bottom:10px}
    .brand{display:flex;gap:10px;align-items:center}.brand img{width:40px;height:40px;object-fit:contain}
    .title{font-size:1.04rem;font-weight:800;line-height:1.2}.sub{font-size:.82rem;color:#d9ecff}
    .actions{display:flex;gap:7px;flex-wrap:wrap}
    .btn{border:1px solid #b9d4ee;border-radius:9px;padding:7px 10px;font-weight:700;text-decoration:none;background:#063b71;color:#fff;min-height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
    .btn.secondary{background:#eef7ff;color:#07345f}.btn.danger{background:#fff0f0;color:#8a1f1f;border-color:#f1c7c7}.btn:disabled{opacity:.55;cursor:not-allowed}
    .warn,.ok{display:none;border-radius:12px;font-weight:700;line-height:1.35;padding:9px;margin:8px 0;white-space:pre-wrap}
    .warn{border:1px solid #f1c7c7;background:#fff2f2;color:#7a1f1f}.ok{border:1px solid #bce9c9;background:#effff4;color:#11612b}
    .card{background:#fff;border:1px solid #d5deef;border-radius:14px;padding:12px;box-shadow:0 3px 14px rgba(18,44,87,.10);margin-bottom:10px}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.toolbar .left,.toolbar .right{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
    select,input{box-sizing:border-box;border:1px solid #cbd7ee;border-radius:9px;padding:7px 9px;min-height:36px;color:#1a4170;font-family:"Segoe UI",Arial,sans-serif;font-size:.9rem}
    .selectorGrid{display:grid;grid-template-columns:220px 1fr 180px;gap:8px;align-items:end}
    label{display:block;font-size:.82rem;font-weight:750;color:#1a4170;margin:0 0 3px}
    .auditHeader{display:grid;grid-template-columns:1.25fr .75fr;gap:10px}
    .sectionGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .metricGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
    .box{border:1px solid #d5deef;border-radius:12px;background:#f7fbff;padding:10px}
    .box h3{margin:0 0 6px;color:#06305c;font-size:.98rem}
    .text{white-space:pre-wrap;color:#203a64;line-height:1.42;font-size:.91rem}
    .small{font-size:.82rem;color:#48628e;line-height:1.32}
    .pill{display:inline-block;border:1px solid #d5deef;border-radius:999px;padding:3px 9px;background:#eaf1fb;color:#1a4170;font-weight:750;font-size:.76rem;white-space:nowrap;margin:2px 3px 2px 0}
    .pill.green{background:#e9fff0;border-color:#bce9c9;color:#11612b}.pill.amber{background:#fff8e6;border-color:#f0d28b;color:#7a5200}.pill.red{background:#fff0f0;border-color:#f1c7c7;color:#7a1f1f}
    .evidenceList{display:grid;gap:8px}
    .evidenceItem{border:1px solid #dbe6f6;border-radius:12px;background:#fff;padding:9px}
    .evidenceTitle{font-weight:850;color:#06305c;margin-bottom:3px}
    .kv{display:grid;grid-template-columns:160px 1fr;gap:5px;font-size:.86rem;border-top:1px solid #edf3fb;padding-top:5px;margin-top:5px}
    .k{font-weight:750;color:#35507b}
    .printOnly{display:none}
    @media(max-width:1100px){.selectorGrid,.auditHeader,.sectionGrid,.metricGrid{grid-template-columns:1fr}.actions,.btn{width:100%}.btn{justify-content:center}}
    @media print{
      body{background:#fff;padding:0;color:#000}
      .topbar,.selectorCard,.actions .noPrint,.warn,.ok{display:none!important}
      .wrap{width:100%;max-width:none}
      .card,.box,.evidenceItem{box-shadow:none;border-color:#999;break-inside:avoid}
      .printOnly{display:block}
      .sectionGrid,.auditHeader{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <img src="./assets/csv-beacon-icon.png" alt="C.S.V. BEACON" />
        <div>
          <div class="title">TMSA KPI Audit Presentation</div>
          <div class="sub" id="subLine">Checking session...</div>
        </div>
      </div>

      <div class="actions">
        <a class="btn" href="./tmsa-office.html">TMSA Manager</a>
        <a class="btn secondary" href="./tmsa-evidence.html">Evidence Register</a>
        <a class="btn secondary" href="./tmsa-kpi-import.html">KPI Text Import</a>
        <a class="btn" href="./q-dashboard.html">Dashboard</a>
        <button class="btn noPrint" id="printBtn" type="button">Print / PDF</button>
        <button class="btn noPrint" id="logoutBtn" type="button">Logout</button>
      </div>
    </div>

    <div id="warnBox" class="warn"></div>
    <div id="okBox" class="ok"></div>

    <div class="card selectorCard">
      <div class="selectorGrid">
        <div>
          <label for="companyFilter">Company</label>
          <select id="companyFilter" style="display:none;"><option value="">Company</option></select>
        </div>

        <div>
          <label for="elementFilter">TMSA element</label>
          <select id="elementFilter"><option value="">Loading elements...</option></select>
        </div>

        <div>
          <label for="kpiFilter">KPI</label>
          <select id="kpiFilter"><option value="">Loading KPIs...</option></select>
        </div>
      </div>

      <div class="actions" style="margin-top:10px;">
        <button class="btn secondary" id="prevBtn" type="button">Previous KPI</button>
        <button class="btn secondary" id="nextBtn" type="button">Next KPI</button>
        <button class="btn" id="refreshBtn" type="button">Refresh</button>
      </div>
    </div>

    <div id="presentationBody" class="card">
      Loading TMSA KPI presentation...
    </div>
  </div>

  <script type="module" src="./tmsa-kpi-presentation-v01.js?v=20260612_cleanup_1"></script>
</body>
</html>
