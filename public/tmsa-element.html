<!-- public/tmsa-element.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>C.S.V. BEACON - TMSA Element Workspace</title>

  <link rel="stylesheet" href="./csv-beacon-theme.css?v=20260428_3" />
  <link rel="stylesheet" href="./style.css?v=20260428_3" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./auth.js"></script>
  <script src="./csvb-module-guard.js?v=20260611_tmsa_element_1"></script>

  <style>
    body{margin:0;padding:10px;background:#eef4fb;font-family:"Segoe UI",Arial,sans-serif;color:#06305c}
    .wrap{width:calc(100vw - 20px);max-width:none;margin:0 auto}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#062b55;color:#fff;border-radius:14px;padding:9px 12px;margin-bottom:10px}
    .brand{display:flex;gap:10px;align-items:center}.brand img{width:40px;height:40px;object-fit:contain}
    .title{font-size:1.04rem;font-weight:800;line-height:1.2}.sub{font-size:.82rem;color:#d9ecff}
    .actions{display:flex;gap:7px;flex-wrap:wrap}
    .btn{border:1px solid #b9d4ee;border-radius:9px;padding:7px 10px;font-weight:700;text-decoration:none;background:#063b71;color:#fff;min-height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
    .btn.secondary{background:#eef7ff;color:#07345f}.btn.danger{background:#fff0f0;color:#8a1f1f;border-color:#f1c7c7}.btn:disabled{opacity:.55;cursor:not-allowed}
    .warn,.ok{display:none;border-radius:12px;font-weight:700;line-height:1.35;padding:9px;margin:8px 0;white-space:pre-wrap}
    .warn{border:1px solid #f1c7c7;background:#fff2f2;color:#7a1f1f}.ok{border:1px solid #bce9c9;background:#effff4;color:#11612b}
    .card{background:#fff;border:1px solid #d5deef;border-radius:14px;padding:10px;box-shadow:0 3px 14px rgba(18,44,87,.10);margin-bottom:10px}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.toolbar .left,.toolbar .right{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
    input,select,textarea{box-sizing:border-box;border:1px solid #cbd7ee;border-radius:9px;padding:7px 9px;min-height:36px;color:#1a4170;font-family:"Segoe UI",Arial,sans-serif;font-size:.9rem}
    textarea{width:100%;min-height:84px;resize:vertical}
    label{display:block;font-size:.82rem;font-weight:750;color:#1a4170;margin:6px 0 3px}
    .summaryGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
    .summaryBox{border:1px solid #d5deef;border-radius:12px;background:#f7fbff;padding:8px}
    .summaryBox .num{font-size:1.25rem;font-weight:850;color:#06305c}
    .levelBlock{border:1px solid #cbd7ee;border-radius:14px;background:#f8fbff;margin:10px 0;padding:10px}
    .levelTitle{margin:0 0 8px;color:#06305c}
    .kpiCard{background:#fff;border:1px solid #d8e4f5;border-radius:14px;margin:10px 0;padding:10px}
    .kpiHeader{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start}
    .kpiTitle{font-weight:850;color:#06305c;font-size:1rem}
    .sectionGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
    .formGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.full{grid-column:1/-1}
    .box{border:1px solid #dbe6f6;background:#f7fbff;border-radius:12px;padding:8px}
    .box h4{margin:0 0 5px;color:#06305c}
    .text{white-space:pre-wrap;color:#203a64;line-height:1.42;font-size:.9rem}
    .small{font-size:.82rem;color:#48628e;line-height:1.32}
    .pill{display:inline-block;border:1px solid #d5deef;border-radius:999px;padding:2px 8px;background:#eaf1fb;color:#1a4170;font-weight:750;font-size:.74rem;white-space:nowrap;margin:1px}
    .pill.green{background:#e9fff0;border-color:#bce9c9;color:#11612b}.pill.amber{background:#fff8e6;border-color:#f0d28b;color:#7a5200}.pill.red{background:#fff0f0;border-color:#f1c7c7;color:#7a1f1f}
    .evidenceItem{border:1px solid #dbe6f6;border-radius:10px;background:#fff;padding:6px;margin-top:5px}
    .stickyBar{position:sticky;top:0;z-index:5;background:#eef4fb;padding-bottom:6px}
    @media(max-width:1100px){.summaryGrid,.sectionGrid,.formGrid{grid-template-columns:1fr}.actions,.btn{width:100%}.btn{justify-content:center}.toolbar .left,.toolbar .right,.toolbar input,.toolbar select{width:100%}}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <img src="./assets/csv-beacon-icon.png" alt="C.S.V. BEACON" />
        <div>
          <div class="title">TMSA Element Workspace</div>
          <div class="sub" id="subLine">Checking session...</div>
        </div>
      </div>

      <div class="actions">
        <a class="btn" href="./tmsa-office.html">TMSA Home</a>
        <a class="btn secondary" href="./tmsa-kpi-presentation.html">Audit Presentation</a>
        <a class="btn secondary" href="./tmsa-evidence.html">Evidence Register</a>
        <a class="btn secondary" href="./tmsa-kpi-config-import.html">Bulk KPI Config</a>
        <button class="btn" id="logoutBtn" type="button">Logout</button>
      </div>
    </div>

    <div id="warnBox" class="warn"></div>
    <div id="okBox" class="ok"></div>

    <div class="stickyBar">
      <div class="card">
        <div class="toolbar">
          <div class="left">
            <h2 id="elementTitle" style="margin:0;">Loading element...</h2>
            <span class="pill" id="elementCodePill">Element</span>
          </div>
          <div class="right">
            <select id="companyFilter" style="display:none;"><option value="">Company</option></select>
            <select id="elementJump"><option value="">Element</option></select>
            <input id="searchBox" placeholder="Search KPI / guidance / notes..." />
            <button class="btn secondary" id="refreshBtn" type="button">Refresh</button>
          </div>
        </div>

        <div class="summaryGrid" style="margin-top:8px;">
          <div class="summaryBox"><div class="num" id="statKpis">0</div><div class="small">KPIs</div></div>
          <div class="summaryBox"><div class="num" id="statLevels">0</div><div class="small">Levels / stages</div></div>
          <div class="summaryBox"><div class="num" id="statReady">0</div><div class="small">Ready / Oil Major-ready</div></div>
          <div class="summaryBox"><div class="num" id="statCalc">0</div><div class="small">Require calculation</div></div>
          <div class="summaryBox"><div class="num" id="statEvidence">0</div><div class="small">Linked evidence</div></div>
        </div>
      </div>
    </div>

    <div id="workspaceBody" class="card">
      Loading TMSA element workspace...
    </div>
  </div>

  <script type="module" src="./tmsa-element-v01.js?v=20260612_importstatus_1"></script>
</body>
</html>
