<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vetting Inspection Planner</title>
  <link rel="stylesheet" href="./csv-beacon-theme.css?v=20260428_3" />
  <link rel="stylesheet" href="./style.css?v=20260428_3" />
  <style>
    :root {
      color-scheme: light;
      --planner-navy: var(--brand-navy, #062A5E);
      --planner-blue: var(--brand-navy-dark, #031B3F);
      --planner-muted: var(--text-muted, #5E6F86);
      --planner-border: var(--border-soft, #D6E4F5);
      --planner-bg: var(--bg-main, #F4F8FC);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 6px;
      background: radial-gradient(1100px 550px at 15% 0%, #1a4170 0%, #0b1c33 58%, #071426 100%);
      color: #15283d;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .planner-wrap { width: 100%; max-width: none; margin: 0; }
    .planner-topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      flex-wrap: wrap; padding: 7px 10px; margin-bottom: 6px;
      border: 1px solid rgba(255,255,255,.24); border-radius: 12px;
      background: rgba(12,33,58,.78); color: #fff;
      box-shadow: 0 10px 34px rgba(0,0,0,.22);
    }
    .planner-title { margin: 0; font-size: 1.2rem; font-weight: 900; }
    .planner-subtitle { margin-top: 4px; color: #d7e6f7; font-size: .9rem; }
    .planner-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .planner-badge { color: #fff; font-size: .84rem; font-weight: 750; }
    .planner-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 6px 9px; border: 1px solid #c7d5e5; border-radius: 8px;
      background: #fff; color: var(--planner-blue); font: inherit; font-weight: 800;
      text-decoration: none; cursor: pointer;
    }
    .planner-btn:disabled { opacity: .55; cursor: not-allowed; }
    .planner-btn.primary { border-color: #1d5ca0; background: #1d5ca0; color: #fff; }
    .planner-panel {
      padding: 8px; margin-bottom: 6px; border: 1px solid var(--planner-border);
      border-radius: 10px; background: #fff; box-shadow: 0 5px 14px rgba(0,0,0,.11);
    }
    .planner-filters { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(190px, .55fr) auto auto; align-items: end; gap: 10px; }
    .planner-show-hidden { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 8px; color: var(--planner-blue); font-size: .87rem; font-weight: 800; white-space: nowrap; }
    .planner-show-hidden input { width: 17px; height: 17px; accent-color: #1d5ca0; }
    .planner-field label { display: block; margin: 0 0 5px; color: var(--planner-blue); font-size: .87rem; font-weight: 850; }
    .planner-field input, .planner-field select, .planner-field textarea {
      width: 100%; min-height: 32px; padding: 5px 7px; border: 1px solid #cbd8e8;
      border-radius: 7px; background: #fff; color: #162b42; font: inherit;
    }
    .planner-field textarea { min-height: 54px; resize: vertical; }
    .planner-statusline { min-height: 18px; margin: 0 0 6px; color: var(--planner-muted); font-size: .9rem; }
    .planner-message { display: none; padding: 8px 10px; margin-bottom: 8px; border-radius: 8px; white-space: pre-wrap; }
    .planner-message.error { display: block; border: 1px solid #e7b4b4; background: #fff2f2; color: #8d2525; }
    .planner-message.success { display: block; border: 1px solid #b5dbc6; background: #f0fbf4; color: #21643b; }
    .planner-vessel-table-wrap {
      max-width: 100%; overflow-x: auto; border: 1px solid var(--planner-border);
      border-radius: 9px; background: #fff; box-shadow: 0 4px 12px rgba(3,27,63,.1);
    }
    .planner-vessel-table { width: 100%; min-width: 1100px; table-layout: fixed; border-collapse: separate; border-spacing: 0; background: #fff; }
    .planner-vessel-table col:nth-child(1) { width: 17%; }
    .planner-vessel-table col:nth-child(2) { width: 15%; }
    .planner-vessel-table col:nth-child(3) { width: 20%; }
    .planner-vessel-table col:nth-child(4) { width: 21%; }
    .planner-vessel-table col:nth-child(5) { width: 22%; }
    .planner-vessel-table col:nth-child(6) { width: 5%; }
    .planner-vessel-table thead th {
      padding: 8px 10px; border: 0; border-bottom: 1px solid var(--brand-navy-dark, #031B3F);
      background: linear-gradient(90deg, var(--brand-navy-dark, #031B3F), var(--brand-navy, #062A5E)) !important;
      color: #fff !important; font-size: .79rem; font-weight: 850; line-height: 1.2;
      text-align: left; vertical-align: middle; white-space: normal;
    }
    .planner-vessel-table thead th:first-child { border-top-left-radius: 8px; }
    .planner-vessel-table thead th:last-child { border-top-right-radius: 8px; }
    .planner-vessel-table tbody tr.vessel-card > td {
      padding: 0; border: 0; border-bottom: 1px solid var(--planner-border);
      background: #fff; vertical-align: top;
    }
    .planner-vessel-table tbody tr.vessel-card:last-of-type > td { border-bottom: 0; }
    .planner-vessel-table tbody tr.vessel-card:hover > td { background: #f7fbfe; }
    .planner-vessel-table tbody tr.vessel-card[hidden] { display: none; }
    .planner-vessel-table tbody tr.planner-no-results > td { padding: 12px; color: var(--planner-muted); text-align: center; }
    .planner-vessel-card-cell { width: 100%; }
    .vessel-card-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      padding: 6px 9px; border-bottom: 1px solid #e4ebf4;
      background: linear-gradient(120deg, #f8fbff, #eef4fa);
    }
    .planner-card-details { display: block; min-width: 0; }
    .planner-card-summary {
      display: grid; grid-template-columns: 17% 15% 20% 21% 22% 5%;
      align-items: center; min-height: 38px; cursor: pointer; list-style: none;
      background: #fff; color: #17324d;
    }
    .planner-card-summary::-webkit-details-marker { display: none; }
    .planner-card-summary:hover { background: #f4f8fc; }
    .planner-card-summary:focus-visible { outline: 3px solid var(--focus, rgba(0,151,167,.35)); outline-offset: -3px; }
    .planner-summary-cell { display: flex; align-items: center; align-self: stretch; min-width: 0; padding: 5px 10px; overflow-wrap: anywhere; font-size: .84rem; line-height: 1.2; }
    .planner-summary-vessel { color: var(--planner-navy); font-weight: 850; }
    .planner-summary-date, .planner-summary-major, .planner-summary-negative { color: var(--text-main, #17324d); font-weight: 600; }
    .planner-summary-status { justify-content: flex-start; }
    .planner-expand-affordance { justify-content: center; padding: 0 4px; color: var(--planner-blue); }
    .planner-expand-chevron { width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg) translateY(-2px); transition: transform .15s ease; }
    .planner-card-details[open] .planner-expand-chevron { transform: rotate(225deg) translate(-1px, -1px); }
    .planner-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .planner-card-expanded { border-top: 1px solid #e4ebf4; background: #fff; }
    .vessel-card-toggles { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .planner-switch { display: inline-flex; align-items: center; gap: 8px; color: #35506c; font-size: .82rem; font-weight: 800; cursor: pointer; }
    .planner-switch input { position: absolute; width: 1px; height: 1px; margin: -1px; opacity: 0; }
    .planner-switch-track { position: relative; width: 38px; height: 22px; flex: none; border-radius: 999px; background: #a8b5c4; transition: background .18s ease; }
    .planner-switch-track::after { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); content: ""; transition: transform .18s ease; }
    .planner-switch input:checked + .planner-switch-track { background: #287347; }
    .planner-switch input:checked + .planner-switch-track::after { transform: translateX(16px); }
    .planner-switch input:focus-visible + .planner-switch-track { outline: 3px solid #75a7df; outline-offset: 2px; }
    .planner-switch input:disabled ~ span { opacity: .6; cursor: not-allowed; }
    .planner-hidden-label { padding: 4px 8px; border: 1px solid #d7dee7; border-radius: 999px; background: #f2f4f7; color: #596779; font-size: .74rem; font-weight: 850; }
    .vessel-name { margin: 0; color: var(--planner-navy); font-size: 1.12rem; font-weight: 900; }
    .vessel-status {
      flex: none; padding: 6px 10px; border: 1px solid transparent; border-radius: 999px;
      font-size: .82rem; font-weight: 850; white-space: nowrap;
    }
    .status-overdue { padding: 9px 14px; border-color: #7f1d1d; background: #b91c1c; color: #fff; font-size: 1rem; font-weight: 950; letter-spacing: .04em; text-transform: uppercase; box-shadow: 0 0 0 3px rgba(185,28,28,.15); }
    .status-warning { border-color: #dc2626; background: #fee2e2; color: #991b1b; }
    .status-approaching { border-color: hsl(var(--planner-status-hue, 120) 55% 62%); background: hsl(var(--planner-status-hue, 120) 80% 94%); color: hsl(var(--planner-status-hue, 120) 75% 25%); transition: color .2s linear, background-color .2s linear, border-color .2s linear; }
    .status-within { border-color: #b8ddc5; background: #effaf2; color: #246b3e; }
    .status-none { border-color: #d7dee7; background: #f2f4f7; color: #596779; }
    .vessel-summary {
      display: grid; grid-template-columns: repeat(2, minmax(130px, 1fr)); gap: 6px;
      padding: 6px 9px; border-bottom: 1px solid #e4ebf4;
    }
    .summary-label { color: var(--planner-muted); font-size: .76rem; font-weight: 750; text-transform: uppercase; letter-spacing: .035em; }
    .summary-value { margin-top: 2px; color: var(--planner-navy); font-weight: 850; }
    .planner-section { padding: 6px 9px; }
    .planner-section + .planner-section { border-top: 1px solid #e4ebf4; }
    .section-title { margin: 0 0 5px; color: var(--planner-blue); font-size: .95rem; font-weight: 900; }
    .history-wrap { overflow-x: auto; border: 1px solid #e2e9f1; border-radius: 10px; }
    .history-table { width: 100%; min-width: 700px; border-collapse: collapse; font-size: .86rem; }
    .history-table th, .history-table td { padding: 3px 5px; border-bottom: 1px solid #e9eef5; text-align: left; vertical-align: top; line-height: 1.2; }
    .history-table th { background: #f4f7fb; color: #284761; font-size: .78rem; white-space: nowrap; }
    .history-table tr:last-child td { border-bottom: 0; }
    .history-empty { padding: 8px; color: var(--planner-muted); }
    .plan-fields { display: grid; grid-template-columns: minmax(155px, .6fr) minmax(0, 3fr) auto; gap: 8px; align-items: end; }
    .oil-major-fields { display: grid; grid-template-columns: repeat(3, minmax(150px, 1fr)); gap: 8px; }
    .planner-suggestion { display: flex; align-items: center; gap: 9px; width: fit-content; max-width: 100%; margin-top: 7px; padding: 5px 8px; border: 1px solid #d4e0ee; border-radius: 8px; background: #f7f9fc; }
    .suggestion-copy { display: flex; align-items: center; flex-wrap: wrap; gap: 3px 10px; min-width: 0; }
    .suggestion-title { color: #526982; font-size: .72rem; font-weight: 850; letter-spacing: .03em; text-transform: uppercase; }
    .suggestion-major { color: var(--planner-navy); font-size: .88rem; font-weight: 900; }
    .suggestion-metrics { display: flex; gap: 9px; flex-wrap: wrap; color: #425b75; font-size: .77rem; }
    .planner-suggestion p { max-width: 420px; margin: 0; color: #4e6278; font-size: .77rem; line-height: 1.25; }
    .planner-suggestion .planner-btn { flex: none; padding: 5px 8px; font-size: .8rem; }
    .planner-remarks { margin-top: 8px; padding: 8px; border: 1px solid #d7e2ef; border-radius: 9px; background: #fbfcfe; }
    .remarks-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
    .remarks-title { margin: 0; color: var(--planner-blue); font-size: .9rem; font-weight: 900; }
    .planner-draft-note { margin-top: 3px; color: #65778c; font-size: .75rem; }
    .remarks-list { display: grid; gap: 5px; }
    .remark-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; align-items: start; gap: 7px; }
    .remark-number { padding-top: 7px; color: #51677f; font-size: .8rem; font-weight: 850; white-space: nowrap; }
    .remark-text { width: 100%; min-height: 42px; padding: 6px 8px; border: 1px solid #cbd8e8; border-radius: 7px; color: #162b42; font: inherit; resize: vertical; }
    .remark-remove { padding: 5px 7px; font-size: .78rem; }
    .remarks-empty { padding: 5px 0; color: var(--planner-muted); font-size: .82rem; }
    .field-hint { margin-top: 3px; color: var(--planner-muted); font-size: .75rem; }
    .planner-empty { padding: 16px; color: var(--planner-muted); text-align: center; }
    .planner-readonly-note { margin-top: 6px; color: var(--planner-muted); font-size: .82rem; }
    .vessel-card .planner-btn { padding: 5px 8px; }
    @media (max-width: 760px) {
      body { padding: 5px; }
      .planner-filters, .plan-fields, .oil-major-fields { grid-template-columns: 1fr; }
      .planner-suggestion { width: 100%; align-items: flex-start; flex-wrap: wrap; }
      .planner-suggestion p { max-width: none; }
      .vessel-summary { grid-template-columns: 1fr 1fr; gap: 6px; }
      .vessel-card-head { flex-direction: column; }
      .remark-row { grid-template-columns: minmax(0, 1fr) auto; }
      .remark-number { grid-column: 1 / -1; padding-top: 0; }
      .planner-vessel-table { min-width: 1100px; }
    }
  </style>
  <link rel="stylesheet" href="./csvb-module-header.css?v=20261027_1" />
</head>
<body>
  <main class="planner-wrap">
    <header class="planner-topbar csvb-module-header">
      <div class="csvb-module-header-identity">
        <h1 class="planner-title">Vetting Inspection Planner</h1>
        <div class="planner-subtitle">Inspection Libraries &amp; Vetting</div>
      </div>
      <div class="planner-actions csvb-module-header-actions">
        <span class="planner-badge csvb-module-header-meta" id="userBadge">Loading account…</span>
        <a class="planner-btn csvb-module-header-action" href="./q-dashboard.html">Dashboard</a>
        <button class="planner-btn csvb-module-header-action" id="refreshPlannerBtn" type="button">Refresh</button>
        <button class="planner-btn primary csvb-module-header-action" id="logoutBtn" type="button">Logout</button>
      </div>
    </header>

    <section class="planner-panel">
      <div id="plannerMessage" class="planner-message" role="status" aria-live="polite"></div>
      <div class="planner-filters">
        <div class="planner-field">
          <label for="vesselSearch">Search vessel</label>
          <input id="vesselSearch" type="search" placeholder="Type a vessel name" autocomplete="off" />
        </div>
        <label class="planner-show-hidden" for="showHiddenVessels">
          <input id="showHiddenVessels" type="checkbox" />
          <span>Show hidden vessels</span>
        </label>
        <div class="planner-field">
          <label for="statusFilter">Decision status</label>
          <select id="statusFilter">
            <option value="">All statuses</option>
            <option value="overdue">Overdue</option>
            <option value="warning">Due within 15 days</option>
            <option value="approaching">Approaching due</option>
            <option value="within">Within window</option>
            <option value="none">No inspection history</option>
          </select>
        </div>
        <button class="planner-btn" id="clearFiltersBtn" type="button">Clear filters</button>
      </div>
    </section>

    <div class="planner-statusline" id="plannerStatus" aria-live="polite">Loading accessible active vessels and inspection history…</div>
    <section id="vesselCards" aria-live="polite"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="./app-config.js"></script>
  <script src="./auth.js"></script>
  <script src="./csvb-module-guard.js?v=20261014_vetting_planner_1"></script>
  <script type="module" src="./vetting-inspection-planner.js?v=20261014_vetting_planner_6"></script>
</body>
</html>
